<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ScentQI – Free Blend Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #faf7f2;
      margin: 0;
      padding: 40px 16px;
      color: #333;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      padding: 32px 28px;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.06);
    }
    h1 {
      text-align: center;
      font-size: 28px;
      margin: 0 0 16px;
    }
    .sub {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #aa8a63;
      margin-bottom: 4px;
    }
    .name {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .blend {
      font-weight: 500;
      margin-bottom: 16px;
    }
    .msg {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .usage {
      font-size: 13px;
      color: #666;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f0e0c5;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 10px;
    }
    .btn-row {
      margin-top: 24px;
      text-align: center;
    }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: #d49b5b;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      margin: 0 6px;
    }
    .btn:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div id="content"></div>
    </div>
  </div>

  <script>
    function getParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        status: params.get("status") || "",
        usage: params.get("usage") || "",
        name: params.get("name") || "",
        blend: params.get("blend") || "",
        msg: params.get("msg") || ""
      };
    }

    const { status, usage, name, blend, msg } = getParams();
    const content = document.getElementById("content");

    if (!status) {
      // No data – generic fallback
      content.innerHTML = `
        <h1>Your Custom Scent Blend</h1>
        <p class="sub">No blend data was provided. Try generating a new blend from <a href="https://scentiq.ai/">ScentIQ.ai</a>.</p>
      `;
    } else if (status === "limit_reached") {
      // Limit reached view
      content.innerHTML = `
        <div class="badge">Limit Reached</div>
        <h1>Free Blend Limit Reached</h1>
        <p class="msg">${msg || "You’ve reached your free blend limit."}</p>
        <div class="btn-row">
          <a class="btn" href="https://scentiq.ai/pricing">View Subscription Options</a>
        </div>
      `;
    } else {
      // Normal blend view
      const safeName = name || "Your Custom Candle";
      const safeBlend = blend || "";
      const safeMsg = msg || "";

      content.innerHTML = `
        <span class="badge">Your Latest ScentQI Blend</span>
        <h1>Your Custom Scent Blend</h1>
        <p class="sub">Here’s your AI-generated fragrance profile.</p>

        <div class="label">Blend Name</div>
        <div class="name">${safeName}</div>

        <div class="label" style="margin-top:16px;">Blend</div>
        <div class="blend">${safeBlend}</div>

        <div class="label" style="margin-top:16px;">Details</div>
        <p class="msg">${safeMsg}</p>

        <div class="usage">Free blends used: ${usage || "?"} of 3</div>

        <div class="btn-row">
          <a class="btn" href="https://scentiq.ai/">Create Another Blend</a>
        </div>
      `;
    }
  </script>
</body>
</html>
